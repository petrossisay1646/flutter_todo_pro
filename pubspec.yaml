name: flutter_todo_pro
description: "A modern, full-stack productivity & task management mobile application built with Flutter, connecting to the MERN Todo Pro REST API."
publish_to: 'none'
version: 2.0.1+2

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  
  # State Management & DI
  flutter_riverpod: ^2.5.1
  
  # Networking
  dio: ^5.4.3+1
  http: ^1.2.1
  
  # Local Storage & Preferences
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.0.0
  
  # Navigation & Utilities
  intl: ^0.19.0
  uuid: ^4.4.0
  
  # UI & Design
  google_fonts: ^6.2.1
  lucide_icons: ^0.257.0
  flutter_svg: ^2.0.10+1
  percent_indicator: ^4.2.3
  fl_chart: ^0.68.0

  # Notifications (Pomodoro timer sound)
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
